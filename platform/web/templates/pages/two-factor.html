{{define "content"}}<section class="login-card"><p class="eyebrow">Account security</p><h1>Enter your code</h1><p>We emailed a six-digit code to your account address.</p>{{if .Data.Error}}<p class="form-error" role="alert">{{.Data.Error}}</p>{{end}}<form method="post" action="/two-factor"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><input type="hidden" name="challenge" value="{{.Data.Challenge}}"><input type="hidden" name="next" value="{{.Data.Next}}"><label>Security code<input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" maxlength="6" required autofocus></label><button type="submit">Verify and sign in</button></form></section>{{end}}
