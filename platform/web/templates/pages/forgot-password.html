{{define "content"}}<section class="login-card"><p class="eyebrow">Account recovery</p><h1>Forgot password</h1>{{if .Data.Error}}<p class="form-error" role="alert">{{.Data.Error}}</p>{{end}}{{if .Data.Notice}}<p class="form-success">{{.Data.Notice}}</p>{{else}}<form method="post" action="/forgot-password"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><label>Email<input type="email" name="email" autocomplete="email" required></label><button type="submit">Send reset link</button></form>{{end}}</section>{{end}}
