{{define "content"}}<section class="login-card"><p class="eyebrow">Account recovery</p><h1>Reset password</h1>{{if .Data.Error}}<p class="form-error" role="alert">{{.Data.Error}}</p>{{end}}<form method="post" action="/reset-password"><input type="hidden" name="_csrf" value="{{.CSRFToken}}"><input type="hidden" name="token" value="{{.Data.Token}}"><label>New password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required></label><button type="submit">Reset password</button></form></section>{{end}}
