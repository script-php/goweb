name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate tag and release metadata
        run: make release-check
      - name: Test release commit
        run: go test -race ./...
      - name: Vet release commit
        run: go vet ./...
      - name: Scan release commit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build Linux archives
        run: make release RELEASE_ARCHES="amd64 arm64"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "GoWeb ${GITHUB_REF_NAME}"
