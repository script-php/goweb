# Replace example.com and the certificate paths before enabling this file.
# Keep 127.0.0.1 in server.trusted_proxies when Nginx runs on this host.
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    access_log /var/log/nginx/website-access.log;
    error_log /var/log/nginx/website-error.log warn;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location ~ ^/health(?:/live|/ready)?$ {
        proxy_pass http://127.0.0.1:9090$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }
}
